name: Copilot Review Gate

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  copilot-reviewed:
    name: copilot-reviewed
    runs-on: ubuntu-latest

    steps:
      - name: Verificar revisão do Copilot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Verificando se o Copilot revisou o PR..."

          REVIEWS=$(gh api \
            "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --paginate \
            --jq '.[].user.login')

          echo "Revisores encontrados:"
          echo "$REVIEWS"

          if echo "$REVIEWS" | grep -Fxq "copilot-pull-request-reviewer[bot]"; then
            echo "✅ Copilot revisou este Pull Request."
            exit 0
          else
            echo "❌ O Pull Request ainda não foi revisado pelo Copilot."
            exit 1
          fi